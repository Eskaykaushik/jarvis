<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis — AI Assistant</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="header__title">Jarvis</h1>
            <span class="header__status" id="status">connecting...</span>
        </header>

        <main class="chat" id="chat">
            <div class="chat__messages" id="messages">
                <div class="message message--system">
                    <p>Hi, I'm Jarvis. Ask me anything.</p>
                </div>
            </div>
        </main>

        <form class="input-bar" id="input-form">
            <input
                type="text"
                class="input-bar__field"
                id="input-field"
                placeholder="Type a message..."
                autocomplete="off"
                required
            >
            <button type="submit" class="input-bar__send" id="send-btn">Send</button>
        </form>
    </div>

    <script src="js/marked.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cache.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/api.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
