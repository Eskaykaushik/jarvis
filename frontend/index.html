<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaushix — AI Assistant</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
    <div class="app" id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__header">
                <button class="sidebar__new-chat" id="new-chat-btn">+ New Chat</button>
                <button class="sidebar__close" id="sidebar-close">&times;</button>
            </div>
            <input type="text" class="sidebar__search" id="conversation-search" placeholder="Search conversations...">
            <div class="sidebar__list" id="conversation-list">
                <!-- Populated by sidebar.js -->
            </div>
        </aside>

        <!-- Main area -->
        <div class="main-area">
            <header class="header">
                <button class="header__menu" id="sidebar-toggle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <h1 class="header__title">Kaushix</h1>
                <span class="header__status" id="status">connecting...</span>
                <button class="header__signout" id="signout-btn" style="display:none;">Sign out</button>
            </header>

            <main class="chat" id="chat">
                <div class="chat__messages" id="messages">
                    <div class="message message--system">
                        <p>Hi, I'm Kaushix. Ask me anything.</p>
                    </div>
                </div>
            </main>

            <form class="input-bar" id="input-form">
                <input
                    type="text"
                    class="input-bar__field"
                    id="input-field"
                    placeholder="Type a message..."
                    autocomplete="off"
                    required
                >
                <button type="submit" class="input-bar__send" id="send-btn">Send</button>
            </form>
        </div>
    </div>

    <div class="auth-screen" id="auth-screen">
        <div class="auth-card">
            <h1 class="auth-card__title">Kaushix</h1>
            <p class="auth-card__subtitle">Sign in to continue</p>

            <div class="auth-divider"><span>or</span></div>

            <form class="auth-form" id="auth-form">
                <input type="email" id="auth-email" class="auth-input" placeholder="Email" required>
                <input type="password" id="auth-password" class="auth-input" placeholder="Password" required>
                <div class="auth-error" id="auth-error"></div>
                <button type="submit" class="auth-submit" id="auth-submit">Sign In</button>
            </form>

            <button class="auth-switch" id="auth-switch">Need an account? Sign Up</button>

            <div class="auth-divider"><span>or</span></div>
            <div class="auth-oauth">
                <button class="auth-oauth-btn auth-google" id="auth-google">
                    <span>Sign in with Google</span>
                </button>
                <button class="auth-oauth-btn auth-github" id="auth-github">
                    <span>Sign in with GitHub</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/marked.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cache.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
